<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Know Your Housing</title>


<style>

/* =========================================================
   PAGE
========================================================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f3f6f8;

    color: #17324d;

}


/* =========================================================
   GAME CONTAINER
========================================================= */

.game {

    width: 95%;

    max-width: 1150px;

    min-height: 720px;

    margin: 30px auto;

    background: white;

    border-radius: 28px;

    overflow: hidden;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.15);

}


/* =========================================================
   HEADER
========================================================= */

header {

    background: #17324d;

    color: white;

    padding: 28px 45px;

}

header h1 {

    margin: 0;

    font-size: 32px;

}

header p {

    margin: 7px 0 0;

    color: #dce8f0;

    font-size: 16px;

}


/* =========================================================
   MAIN
========================================================= */

main {

    padding: 50px;

}

.screen {

    display: none;

}

.screen.active {

    display: block;

}


/* =========================================================
   CATEGORY SCREEN
   ONLY ICONS — NO WORDS
========================================================= */

.categories {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 30px;

    min-height: 500px;

    align-items: center;

}


.category {

    border: none;

    height: 350px;

    border-radius: 28px;

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    cursor: pointer;

    transition:
        transform 0.2s,
        box-shadow 0.2s;

}


.category:hover {

    transform:
        translateY(-8px);

    box-shadow:
        0 15px 30px rgba(0,0,0,0.18);

}


.category:active {

    transform:
        translateY(-2px);

}


.who {

    background: #2f80c0;

}


.what {

    background: #2aa89b;

}


.where {

    background: #dda52f;

}


.icon {

    font-size: 105px;

    line-height: 1;

}


/* =========================================================
   QUESTION SCREEN
========================================================= */

.question-container {

    max-width: 950px;

    margin: auto;

}


.back {

    border: none;

    background: none;

    color: #6d7d89;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    padding: 0;

    margin-bottom: 20px;

}


.back:hover {

    color: #17324d;

}


.category-label {

    display: inline-block;

    padding: 10px 18px;

    border-radius: 25px;

    background: #edf3f7;

    color: #17324d;

    font-size: 14px;

    font-weight: bold;

    margin-bottom: 20px;

}


/* =========================================================
   QUESTION CARD
========================================================= */

.question-card {

    background: #f8fafb;

    border:
        2px solid #e1e8ed;

    border-radius: 24px;

    padding: 40px;

}


.question-card h2 {

    font-size: 30px;

    line-height: 1.4;

    margin:
        0 0 30px;

    color: #17324d;

}


/* =========================================================
   ANSWERS
========================================================= */

.answers {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 16px;

}


.answer {

    background: white;

    border:
        2px solid #dce5ea;

    border-radius: 16px;

    padding: 22px;

    font-size: 17px;

    font-weight: bold;

    line-height: 1.45;

}


.letter {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    width: 38px;

    height: 38px;

    margin-right: 10px;

    border-radius: 10px;

    background: #edf3f7;

    color: #17324d;

    font-weight: bold;

}


/* =========================================================
   CORRECT ANSWER
========================================================= */

.answer.correct {

    background: #e7f7f3;

    border-color: #2aa89b;

}


.answer.correct .letter {

    background: #2aa89b;

    color: white;

}


/* =========================================================
   REVEAL BUTTON
========================================================= */

.reveal {

    width: 100%;

    margin-top: 25px;

    padding: 20px;

    border: none;

    border-radius: 16px;

    background: #17324d;

    color: white;

    font-size: 19px;

    font-weight: bold;

    cursor: pointer;

}


.reveal:hover {

    background: #254b6c;

}


/* =========================================================
   EXPLANATION
========================================================= */

.explanation {

    display: none;

    margin-top: 22px;

    padding: 22px;

    background: #fff5d8;

    border-left:
        6px solid #dda52f;

    border-radius: 12px;

    line-height: 1.55;

}


.explanation.show {

    display: block;

}


.explanation strong {

    color: #77570e;

    font-size: 18px;

}


/* =========================================================
   NEXT STUDENT
========================================================= */

.next {

    display: none;

    width: 100%;

    margin-top: 22px;

    padding: 20px;

    border: none;

    border-radius: 16px;

    background: #2aa89b;

    color: white;

    font-size: 19px;

    font-weight: bold;

    cursor: pointer;

}


.next:hover {

    background: #218b80;

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 850px) {

    main {

        padding: 30px;

    }


    .categories {

        grid-template-columns: 1fr;

    }


    .category {

        height: 200px;

    }


    .answers {

        grid-template-columns: 1fr;

    }

}

</style>

</head>


<body>


<div class="game">


<!-- =======================================================
     HEADER
======================================================= -->

<header>

<h1>🏠 Know Your Housing</h1>

<p>
Learn about off-campus housing support, one question at a time.
</p>

</header>



<main>


<!-- =======================================================
     CATEGORY SCREEN
     
     IMPORTANT:
     The physical wheel determines the category.
     The digital screen ONLY shows the three icons.
======================================================= -->

<section
    id="home"
    class="screen active"
>


<div class="categories">


<!-- WHO WE ARE -->

<button
    class="category who"
    onclick="startGame('who')"
>

<div class="icon">

👥

</div>

</button>



<!-- WHAT WE DO -->

<button
    class="category what"
    onclick="startGame('what')"
>

<div class="icon">

🏠

</div>

</button>



<!-- WHERE WE ARE LOCATED -->

<button
    class="category where"
    onclick="startGame('where')"
>

<div class="icon">

📍

</div>

</button>


</div>

</section>



<!-- =======================================================
     QUESTION SCREEN
======================================================= -->

<section
    id="questionScreen"
    class="screen"
>


<div class="question-container">


<button
    class="back"
    onclick="goHome()"
>

← Back to categories

</button>



<div
    id="categoryLabel"
    class="category-label"
>

CATEGORY

</div>



<div class="question-card">


<h2
    id="questionText"
>

Question

</h2>



<div
    id="answers"
    class="answers"
>

</div>



<button
    id="revealButton"
    class="reveal"
    onclick="revealAnswer()"
>

REVEAL ANSWER

</button>



<div
    id="explanation"
    class="explanation"
>


<strong
    id="correctAnswer"
>

✓ Correct Answer

</strong>


<p
    id="explanationText"
>

Explanation

</p>


</div>



<button
    id="nextButton"
    class="next"
    onclick="goHome()"
>

NEXT STUDENT →

</button>


</div>

</div>

</section>


</main>

</div>



<script>

correct: 2,

"The off-campus housing team is here to support students who have housing questions, concerns, or needs. You do not have to be experiencing a housing crisis to reach out."

"True or false: You have to be experiencing a housing crisis to contact the off-campus housing team.",

answers: [

"True",

"False"

correct: 1,

explanation:
"False! Students can contact the off-campus housing team with housing questions, concerns, or needs. You do not have to wait until your situation becomes a crisis."

},

correct: 0,

"The off-campus housing team is not a landlord. We provide support, information, and resources to help students navigate their housing situations."

correct: 2,

"We help students navigate housing-related situations by providing information, education, and connections to appropriate resources."

],

correct: 1,

"Off-campus housing refers to housing and housing support related to living outside of college residence."

}

/* =========================================================
   WHAT WE DO — 10 QUESTIONS
========================================================= */

what: [

{

],

correct: 2,

explanation:
"Students can reach out to the off-campus housing team for advice, information, and resources when looking for off-campus housing."

},


{

correct: 3,

question:

],

correct: 1,

explanation:
"The off-campus housing team can help students identify and connect with appropriate resources. They do not make housing decisions or sign leases on behalf of students."

question:

{

question:

],

correct: 1,

"The off-campus housing team can educate students about their tenant rights and provide information to help them make informed decisions."

question:

/* =========================================================

========================================================= */

{

],

},


{

question:
"Which of the following is a way for students to contact the off-campus housing team?",

answers: [

"In person",

"Via email",

"All of the above"

],

correct: 3,

explanation:

},


{

question:
"True or false: Students can access the contact information for the off-campus housing team on the Georgian College website.",

answers: [

"True",

],

correct: 0,

explanation:

},


{

question:

answers: [

],

correct: 1,

explanation:
"False! Students do not have to visit in person. They can also contact the off-campus housing team by email at Housing@georgiancollege.ca."

}

]

};



/* =========================================================
   SHUFFLE FUNCTION
========================================================= */

function shuffle(array) {

    const newArray = [...array];


    for (
        let i = newArray.length - 1;
        i > 0;
        i--
    ) {

        const randomIndex =
            Math.floor(
                Math.random() * (i + 1)
            );


        const temp =
            newArray[i];


        newArray[i] =
            newArray[randomIndex];


        newArray[randomIndex] =
            temp;

    }


    return newArray;

}



/* =========================================================
   QUESTION DECKS
========================================================= */

let questionDecks = {

    who:
        shuffle(questions.who),

    what:
        shuffle(questions.what),

    where:
        shuffle(questions.where)

};



/* =========================================================
   CURRENT QUESTION
========================================================= */

let currentQuestion = null;



/* =========================================================
   START GAME
========================================================= */

function startGame(category) {


    /*
       If every question has been used,
       make a new shuffled deck.
    */

    if (
        questionDecks[category].length === 0
    ) {

        questionDecks[category] =
            shuffle(
                questions[category]
            );

    }



    /*
       Remove ONE question from the deck.
    */

    currentQuestion =
        questionDecks[category].pop();



    /* =====================================================
       SHOW QUESTION SCREEN
    ===================================================== */

    document
        .getElementById("home")
        .classList
        .remove("active");


    document
        .getElementById("questionScreen")
        .classList
        .add("active");



    /* =====================================================
       CATEGORY LABEL
    ===================================================== */

    const categoryNames = {

        who:
            "👥 WHO WE ARE",

        what:
            "🏠 WHAT WE DO",

        where:
            "📍 WHERE WE ARE LOCATED"

    };


    document
        .getElementById("categoryLabel")
        .textContent =
        categoryNames[category];



    /* =====================================================
       QUESTION
    ===================================================== */

    document
        .getElementById("questionText")
        .textContent =
        currentQuestion.question;



    /* =====================================================
       ANSWERS
    ===================================================== */

    const answers =
        document
            .getElementById("answers");


    answers.innerHTML = "";



    currentQuestion.answers.forEach(

        function(answer, index) {


            const answerBox =
                document.createElement("div");


            answerBox.className =
                "answer";


            const letter =
                String.fromCharCode(
                    65 + index
                );


            answerBox.innerHTML = `

                <span class="letter">
                    ${letter}
                </span>

                ${answer}

            `;


            answers.appendChild(
                answerBox
            );

        }

    );



    /* =====================================================
       RESET REVEAL
    ===================================================== */

    document
        .getElementById("explanation")
        .classList
        .remove("show");


    document
        .getElementById("revealButton")
        .style
        .display =
        "block";


    document
        .getElementById("nextButton")
        .style
        .display =
        "none";

}



/* =========================================================
   REVEAL ANSWER
========================================================= */

function revealAnswer() {


    if (!currentQuestion) {

        return;

    }


    const answerBoxes =
        document.querySelectorAll(
            ".answer"
        );



    /* Highlight correct answer */

    if (
        answerBoxes[
            currentQuestion.correct
        ]
    ) {

        answerBoxes[
            currentQuestion.correct
        ]
        .classList
        .add("correct");

    }



    /* Correct answer letter */

    const correctLetter =
        String.fromCharCode(
            65 +
            currentQuestion.correct
        );


    document
        .getElementById("correctAnswer")
        .textContent =
        "✓ Correct Answer: " +
        correctLetter;



    /* Explanation */

    document
        .getElementById("explanationText")
        .textContent =
        currentQuestion.explanation;


    document
        .getElementById("explanation")
        .classList
        .add("show");



    /* Hide reveal */

    document
        .getElementById("revealButton")
        .style
        .display =
        "none";



    /* Show next */

    document
        .getElementById("nextButton")
        .style
        .display =
        "block";

}



/* =========================================================
   NEXT STUDENT
========================================================= */

function goHome() {


    document
        .getElementById("questionScreen")
        .classList
        .remove("active");


    document
        .getElementById("home")
        .classList
        .add("active");


    currentQuestion = null;

}

</script>

</body>

</html>
